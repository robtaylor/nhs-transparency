name: Data Collection

on:
  schedule:
    # Run weekly on Sunday at 2am UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      fetch_organizations:
        description: 'Fetch NHS organizations from ODS'
        type: boolean
        default: true
      fetch_contracts:
        description: 'Fetch contracts from data.gov.uk'
        type: boolean
        default: true
      contracts_year_month:
        description: 'Contracts month to fetch (YYYY-MM format, leave empty for latest)'
        type: string
        required: false

env:
  DATABASE_PATH: data/nhs.db

jobs:
  fetch-organizations:
    if: ${{ github.event_name == 'schedule' || github.event.inputs.fetch_organizations == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync

      - name: Download existing database (if exists)
        uses: actions/download-artifact@v4
        with:
          name: nhs-database
          path: data/
        continue-on-error: true

      - name: Initialize database
        run: uv run nhs --db ${{ env.DATABASE_PATH }} init

      - name: Fetch NHS organizations
        run: |
          uv run nhs --db ${{ env.DATABASE_PATH }} fetch organizations
          uv run nhs --db ${{ env.DATABASE_PATH }} stats

      - name: Upload database artifact
        uses: actions/upload-artifact@v4
        with:
          name: nhs-database-orgs
          path: data/nhs.db
          retention-days: 90

  fetch-contracts:
    if: ${{ github.event_name == 'schedule' || github.event.inputs.fetch_contracts == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync

      - name: Download existing database (if exists)
        uses: actions/download-artifact@v4
        with:
          name: nhs-database
          path: data/
        continue-on-error: true

      - name: Initialize database
        run: uv run nhs --db ${{ env.DATABASE_PATH }} init

      - name: Determine contracts month
        id: month
        run: |
          if [ -n "${{ github.event.inputs.contracts_year_month }}" ]; then
            echo "month=${{ github.event.inputs.contracts_year_month }}" >> "$GITHUB_OUTPUT"
          else
            # Get previous month (data is usually delayed by ~1 month)
            echo "month=$(date -d 'last month' '+%Y-%m')" >> "$GITHUB_OUTPUT"
          fi

      - name: Download contracts CSV from Contracts Finder
        run: |
          mkdir -p data

          # Calculate date range - last 2 years of data
          END_DATE=$(date '+%d/%m/%Y')
          START_DATE=$(date -d '2 years ago' '+%d/%m/%Y')

          echo "Fetching NHS contracts from ${START_DATE} to ${END_DATE}"

          # First, perform a search to set up the session
          curl -s -L -c data/cookies.txt -b data/cookies.txt \
            "https://www.contractsfinder.service.gov.uk/Search/Results?Keywords=NHS&PublishedFrom=${START_DATE}&PublishedTo=${END_DATE}" \
            > /dev/null

          # Then download the CSV
          curl -s -L -c data/cookies.txt -b data/cookies.txt \
            "https://www.contractsfinder.service.gov.uk/Search/GetCsvFile" \
            -o "data/contracts-nhs.csv"

          # Check if download succeeded
          if [ -f "data/contracts-nhs.csv" ] && [ -s "data/contracts-nhs.csv" ]; then
            echo "Downloaded $(wc -l < data/contracts-nhs.csv) lines"
            head -2 data/contracts-nhs.csv
          else
            echo "Download failed or empty file"
          fi

          # Also fetch IT-specific contracts
          echo "Fetching IT contracts..."
          for KEYWORD in "Palantir" "TPP" "EMIS" "EPR" "clinical+system"; do
            echo "Searching for: ${KEYWORD}"
            # URL encode spaces as +
            ENCODED_KEYWORD="${KEYWORD// /+}"
            curl -s -L -c data/cookies.txt -b data/cookies.txt \
              "https://www.contractsfinder.service.gov.uk/Search/Results?Keywords=${ENCODED_KEYWORD}&PublishedFrom=${START_DATE}&PublishedTo=${END_DATE}" \
              > /dev/null || continue
            curl -s -L -c data/cookies.txt -b data/cookies.txt \
              "https://www.contractsfinder.service.gov.uk/Search/GetCsvFile" \
              -o "data/contracts-${KEYWORD}.csv" || true
            sleep 2
          done

          rm -f data/cookies.txt

      - name: Load contracts into database
        run: |
          # Load main NHS contracts (filtered to NHS buyers only)
          if [ -f "data/contracts-nhs.csv" ] && [ -s "data/contracts-nhs.csv" ]; then
            echo "Loading NHS contracts..."
            uv run nhs --db ${{ env.DATABASE_PATH }} fetch contracts \
              --file "data/contracts-nhs.csv"
          fi

          # Load IT-specific contracts (also filtered to NHS buyers)
          for CSV in data/contracts-*.csv; do
            if [ -f "$CSV" ] && [ -s "$CSV" ] && [ "$CSV" != "data/contracts-nhs.csv" ]; then
              echo "Loading $CSV..."
              uv run nhs --db ${{ env.DATABASE_PATH }} fetch contracts \
                --file "$CSV" || echo "Failed to load $CSV"
            fi
          done

      - name: Show database stats
        run: uv run nhs --db ${{ env.DATABASE_PATH }} stats

      - name: Upload database artifact
        uses: actions/upload-artifact@v4
        with:
          name: nhs-database-contracts
          path: data/nhs.db
          retention-days: 90

  merge-databases:
    needs: [fetch-organizations, fetch-contracts]
    if: always() && (needs.fetch-organizations.result == 'success' || needs.fetch-contracts.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync

      - name: Download organization database
        uses: actions/download-artifact@v4
        with:
          name: nhs-database-orgs
          path: data/orgs/
        continue-on-error: true

      - name: Download contracts database
        uses: actions/download-artifact@v4
        with:
          name: nhs-database-contracts
          path: data/contracts/
        continue-on-error: true

      - name: Merge databases
        run: |
          mkdir -p data
          uv run python scripts/merge_databases.py \
            --output data/nhs.db \
            data/orgs/nhs.db \
            data/contracts/nhs.db

      - name: Show final stats
        run: |
          uv run nhs --db data/nhs.db stats
          uv run nhs --db data/nhs.db summary

      - name: Upload merged database
        uses: actions/upload-artifact@v4
        with:
          name: nhs-database
          path: data/nhs.db
          retention-days: 90

      - name: Generate report
        run: |
          uv run python scripts/generate_report.py \
            --db data/nhs.db \
            --output data/report.md

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: nhs-report
          path: data/report.md
          retention-days: 90
