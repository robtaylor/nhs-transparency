name: Publish Report

on:
  workflow_run:
    workflows: ["Data Collection"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync

      - name: Download database artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: data-collection.yml
          name: nhs-database
          path: data/
        continue-on-error: true

      - name: Initialize database if not exists
        run: |
          if [ ! -f data/nhs.db ]; then
            echo "No database found, initializing empty one"
            uv run nhs --db data/nhs.db init
          fi

      - name: Generate HTML report
        run: |
          mkdir -p public
          uv run python scripts/generate_html_report.py \
            --db data/nhs.db \
            --output public/index.html

      - name: Generate trust detail pages
        run: |
          uv run python scripts/generate_trust_pages.py \
            --db data/nhs.db \
            --output public/

      - name: Generate supplier detail pages
        run: |
          uv run python scripts/generate_supplier_pages.py \
            --db data/nhs.db \
            --output public/

      - name: Generate markdown report
        run: |
          uv run python scripts/generate_report.py \
            --db data/nhs.db \
            --output public/report.md

      - name: Copy static assets
        run: |
          cp -r docs/assets public/ 2>/dev/null || mkdir -p public/assets

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
